[package]
name = "ixa-epi-covid"
version = "0.1.0"
edition = "2024"
default-run = "ixa-epi-covid"

[lib]
name = "epimodel"
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ixa = { version = "2.0.0-beta2.2", default-features = false, features = ["logging"] }
rand_distr = "0.5.1"
serde = "1.0.217"
serde_json = "1.0.139"
tempfile = "3.25.0"
thiserror = "2.0.18"
memchr = "2.7.6"
zip = { version = "8.5" }
once_cell = { version = "1" }
ouroboros = { version = "0.18.5" }
strum = { version = "0.28.0", features = ["derive"] }
dyn-clone = "1.0.20"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "infection_loop"
harness = false

[features]
default = ["profiling", "pop_reader_archive"]

profiling = ["ixa/profiling"]

# Runs tests that assume the existence of ASPR Synthetic Population files from ZIP archives
pop_reader_tests = ["pop_reader_dataset_tests", "pop_reader_zip_tests"]
# Just (unzipped) dataset tests
pop_reader_dataset_tests = ["pop_reader_archive"]
# Just zipped dataset tests
pop_reader_zip_tests = ["pop_reader_archive"]

# Historical compatibility feature; archive-backed ASPR loading is now always enabled.
# Keep this: We will want this feature gate again when we backport the code to `ixa-fips`.
pop_reader_archive = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Release optimizations with debug info for profiling (e.g. samply)
[profile.profiling]
inherits = "release"
lto = false # LTO clobbers debug symbols on some platforms.
debug = true

[lints.rust]
#turn all rsutc warnings into errors
warnings = "deny"

[lints.clippy]
module_name_repetitions = "allow"
match_wildcard_for_single_variants = "allow"
uninlined_format_args = "allow"
