[package]
name = "ixa-epi-covid"
version = "0.1.0"
edition = "2024"
default-run = "ixa-epi-covid"

[lib]
name = "epimodel"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.102"
dyn-clone = "1.0.20"
dyn-eq = "0.1.3"
dyn-hash = "1.0.0"
indexmap = "2.13.0"
clap = { version = "4", features = ["derive"] }
ixa = { version = "2.0.0-beta2", default-features = false, features = ["logging", "debugger", "progress_bar"] }
ixa-fips = "0.1.4"
rand_distr = "0.5.1"
serde = "1.0.217"
serde_json = "1.0.139"
tempfile = "3.25.0"
thiserror = "2.0.18"

[features]
profiling = ["ixa/profiling"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Release optimizations with debug info for profiling (e.g. samply)
[profile.profiling]
inherits = "release"
debug = true

[lints.rust]
#turn all rsutc warnings into errors
warnings = "deny"

[lints.clippy]
module_name_repetitions = "allow"
match_wildcard_for_single_variants = "allow"
uninlined_format_args = "allow"
