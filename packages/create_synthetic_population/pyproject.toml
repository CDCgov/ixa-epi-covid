[project]
name = "create_synthetic_population"
version = "0.1.0"
description = "Library for creating a synthetic population of a particular size and following state structure from PUMs data"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.4",
    "polars>=1.35.1",
    "geopandas>=1.1.3"
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"
