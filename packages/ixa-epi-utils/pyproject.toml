[project]
name = "ixa-epi-utils"
version = "0.1.0"
description = "Library of utility functions for handling inputs and outputs of the ixa-epi-covid model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.4",
    "polars>=1.35.1",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"
