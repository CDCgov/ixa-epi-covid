[project]
name = "importation"
version = "0.1.0"
description = "Library for generating input files that determine infection importation rates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "census>=0.8.25",
    "dotenv>=0.9.9",
    "numpy>=2.3.4",
    "polars>=1.35.1",
    "us>=3.2.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"
