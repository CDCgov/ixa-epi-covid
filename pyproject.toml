[project]
name = "ixa-epi-covid"
version = "0.1.0"
description = "Epidemiological models for COVID-19 developed in ixa"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "census>=0.8.25",
    "dotenv>=0.9.9",
    "geopandas>=1.1.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.3.4",
    "pandas>=3.0.0",
    "pyarrow>=23.0.0",
    "pygris>=0.2.1",
    "pytest>=9.0.2",
    "requests>=2.32.5",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "us>=3.2.0",
]

[build-system]
requires = ["uv-build>=0.8.13,<0.9.0"]
build-backend = "uv-build"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.pydoclint]
style = 'google'
exclude = '\.git|tests|scripts'
